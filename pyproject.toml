[project]
name = "survey"
version = "0.1.0"
description = "Do LLMs' stated views on contested questions shift with cues about who is asking?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
]

[project.scripts]
survey = "survey.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["survey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
